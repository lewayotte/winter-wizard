<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>❄️ Winter Wizard</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #060a1c;
    }
    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      cursor: crosshair;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <!-- load order matters: data → renderer → entities → save → game -->
  <script src="levels.js"></script>
  <script src="render.js"></script>
  <script src="wizard.js"></script>
  <script src="sun.js"></script>
  <script src="save.js"></script>
  <script src="game.js"></script>
</body>
</html>
